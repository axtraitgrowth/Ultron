version: '3.8'

services:
  # Primary PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: ultron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ultron_admin
      POSTGRES_PASSWORD: ultron_secure_password_2026
      POSTGRES_DB: ultron_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultron_admin -d ultron_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for BullMQ Queues, State Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: ultron-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend NestJS API & WebSocket Server
  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ultron-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://ultron_admin:ultron_secure_password_2026@postgres:5432/ultron_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ultron_super_secure_jwt_secret_key_2026_change_in_production
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
